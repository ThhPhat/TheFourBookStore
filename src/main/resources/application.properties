spring.config.import=optional:file:.env[.properties]spring.application.name=the4BookStore# Database Configuration (Using .env variables with fallback to local)spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/QL_NhaSach?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}spring.datasource.username=${DB_USERNAME:}spring.datasource.password=${DB_PASSWORD:}spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver# HikariCP Cloud Connection Pool Optimizationspring.datasource.hikari.minimum-idle=5spring.datasource.hikari.maximum-pool-size=15spring.datasource.hikari.idle-timeout=30000spring.datasource.hikari.connection-timeout=20000spring.datasource.hikari.max-lifetime=1800000spring.datasource.hikari.pool-name=The4BookStore-HikariCPspring.datasource.hikari.data-source-properties.cachePrepStmts=truespring.datasource.hikari.data-source-properties.prepStmtCacheSize=250spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048spring.datasource.hikari.data-source-properties.useServerPrepStmts=true# JPA/Hibernate Configurationspring.jpa.hibernate.ddl-auto=updatespring.jpa.show-sql=falsespring.jpa.properties.hibernate.format_sql=falsespring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialectspring.jpa.open-in-view=true# Thymeleaf Configurationspring.thymeleaf.cache=truespring.thymeleaf.mode=HTMLspring.thymeleaf.encoding=UTF-8server.tomcat.max-http-form-post-size=10MBserver.tomcat.connection-timeout=20000spring.thymeleaf.servlet.produce-partial-output-while-processing=false# Google OAuth2 Configurationspring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy-google-client-id}spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy-google-client-secret}spring.security.oauth2.client.registration.google.scope=openid,profile,email# JWT Configurationjwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}jwt.cookie-name=the4book_jwt# Mail Configuration (Gmail SMTP - Hỗ trợ chuẩn bảo mật mới TLSv1.2 & TLSv1.3)spring.mail.host=${MAIL_HOST:smtp.gmail.com}spring.mail.port=${MAIL_PORT:587}spring.mail.username=${MAIL_USERNAME:}spring.mail.password=${MAIL_PASSWORD:}spring.mail.properties.mail.smtp.auth=truespring.mail.properties.mail.smtp.starttls.enable=truespring.mail.properties.mail.smtp.starttls.required=truespring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.comspring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2 TLSv1.3spring.mail.properties.mail.smtp.connectiontimeout=5000spring.mail.properties.mail.smtp.timeout=5000spring.mail.properties.mail.smtp.writetimeout=5000# Cloudinary Image Cloud Storagecloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}cloudinary.api-key=${CLOUDINARY_API_KEY:}cloudinary.api-secret=${CLOUDINARY_API_SECRET:}# Multipart Upload Configuration (Cho phép tải ảnh dung lượng lên tới 20MB)spring.servlet.multipart.enabled=truespring.servlet.multipart.max-file-size=20MBspring.servlet.multipart.max-request-size=25MB